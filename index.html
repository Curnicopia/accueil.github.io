<style>
  :root{
    --bg:#1b1e21;
    --panel:#24282c;
    --panel-2:#2e3338;
    --text:#edeae4;
    --text-dim:#9ca3a8;
    --accent:#e8a33d;
    --accent-2:#4fa8a0;
    --border:#3a3f44;
    --danger:#d9634d;
    --radius:10px;
    --tile-size:60px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overflow-x:hidden;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    transition:background 0.4s ease;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
    z-index:0;
  }
  #app{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:28px 6px 80px;}

  header{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin-bottom:28px;
    gap:12px;
    position:relative;
  }
  header h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0;
  }
  #clock{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
    font-size:52px;
    font-weight:400;
    letter-spacing:0.03em;
    text-align:center;
    line-height:1;
  }
  #clock span{font-size:14px;color:var(--text-dim);display:block;font-family:Verdana, Geneva, sans-serif;font-weight:400;margin-top:2px;letter-spacing:0.01em;}

  .icon-btn{
    width:38px;height:38px;
    border-radius:8px;
    border:1px solid var(--border);
    background:rgba(36,40,44,0.7);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:all .15s ease;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--accent);}
  .icon-btn svg{width:18px;height:18px;}

  header .actions{display:flex;gap:8px;}

  #categories-container{
    position:relative;
  }
  .category{
    position:absolute;
    box-sizing:border-box;
    min-width:0;
  }
  .category.cat-moving{
    z-index:30;
    cursor:grabbing;
  }
  .category.cat-moving .category-inner{
    box-shadow:0 16px 36px rgba(0,0,0,0.5), inset 0 0 0 1px var(--accent);
  }
  .category-inner{
    margin:6px;
    border-radius:14px;
    padding:8px 10px 10px;
    background:rgba(36,40,44,0.55);
    backdrop-filter:blur(8px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);
    position:relative;
    transition:box-shadow .15s ease;
  }
  .cat-resize-handle{
    position:absolute;
    top:0;bottom:0;right:-8px;
    width:16px;
    cursor:ew-resize;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity .15s ease;
    z-index:6;
    touch-action:none;
  }
  .category:hover .cat-resize-handle{opacity:1;}
  .cat-resize-handle.resizing{opacity:1;}
  .cat-resize-handle::after{
    content:"";
    width:4px;height:34px;
    border-radius:3px;
    background:rgba(255,255,255,0.22);
  }
  .cat-resize-handle:hover::after, .cat-resize-handle.resizing::after{background:var(--accent);}
  .category-band{
    position:absolute;
    inset:0;
    border-radius:14px;
    opacity:0.16;
    pointer-events:none;
  }
  .category-relief{
    position:absolute;
    inset:0;
    border-radius:14px;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 35%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.16) 100%);
  }
  .category-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
    position:relative;
  }
  .cat-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,0.06);}
  .cat-drag-handle{
    flex:none;
    display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;
    color:var(--text-dim);
    cursor:grab;
    opacity:0;
    transition:opacity .15s ease, color .15s ease;
  }
  .category:hover .cat-drag-handle{opacity:1;}
  .cat-drag-handle:hover{color:var(--accent);}
  .cat-drag-handle svg{width:14px;height:14px;}
  .category.cat-moving{opacity:0.96;}
  .category-head h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
    margin:0;
    flex:1;
  }
  .cat-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .cat-edit-btn{
    opacity:0;
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    padding:2px;display:flex;align-items:center;
    transition:opacity .15s ease, color .15s ease;
  }
  .category:hover .cat-edit-btn{opacity:1;}
  .cat-edit-btn:hover{color:var(--accent);}
  .cat-edit-btn svg{width:14px;height:14px;}

  .tile-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    position:relative;
    min-height:var(--tile-size);
  }

  .tile{
    width:var(--tile-size);height:var(--tile-size);
    flex:0 0 var(--tile-size);
    border-radius:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    position:relative;
    cursor:grab;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--text);
    padding:8px 6px 6px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    user-select:none;
  }
  .tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,0.35);}
  .tile.dragging{opacity:0.35;}
  .tile-ghost{
    border-radius:12px;
    opacity:0.92;
    box-shadow:0 14px 34px rgba(0,0,0,0.55);
    transform:scale(1.05);
    pointer-events:none;
    cursor:grabbing;
    z-index:999;
  }
  .tile-icon{
    width:26px;height:26px;
    border-radius:6px;
    margin-top:6px;
    margin-bottom:6px;
    object-fit:cover;
    background:var(--bg);
    -webkit-user-drag:none;
    user-drag:none;
    pointer-events:none;
  }
  .tile.has-custom-icon{padding:0;overflow:hidden;}
  .tile.has-custom-icon .tile-icon{
    width:100%;
    height:100%;
    margin:0;
    border-radius:11px;
    object-fit:cover;
    position:absolute;
    inset:0;
  }
  .tile.has-custom-icon .tile-label{display:none;}
  .tile-fallback{
    width:26px;height:26px;
    border-radius:6px;
    margin-top:6px;
    margin-bottom:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:600;
    background:var(--accent);
    color:#1b1e21;
    pointer-events:none;
  }
  .tile-label{
    font-size:10.5px;
    line-height:1.2;
    text-align:center;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--text-dim);
    pointer-events:none;
  }
  .tile-actions{
    position:absolute;
    top:6px;right:6px;
    display:flex;
    gap:4px;
    opacity:0;
    transition:opacity .12s ease;
    z-index:3;
  }
  .tile:hover .tile-actions{opacity:1;}
  .tile-actions button{
    width:20px;height:20px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:11px;
    padding:0;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .tile-actions button:hover{color:var(--text);border-color:var(--accent);}
  .tile-actions svg{width:11px;height:11px;}

  #add-category-btn{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1.5px dashed rgba(255,255,255,0.14);
    background:rgba(36,40,44,0.35);
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .15s ease;
  }
  #add-category-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    width:100%;
    max-width:360px;
    max-height:86vh;
    overflow-y:auto;
  }
  .modal h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.04em;
  }
  .field input[type=text], .field input[type=url]{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .field input[type=text]:focus, .field input[type=url]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field select{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .color-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;}
  .color-wheel-btn{
    position:relative;
    width:26px;height:26px;
    border-radius:50%;
    background:conic-gradient(from 0deg, red, yellow, lime, cyan, blue, magenta, red);
    cursor:pointer;
    display:inline-block;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
    flex:none;
  }
  .color-wheel-btn input[type=color]{
    position:absolute;
    inset:-4px;
    width:calc(100% + 8px);
    height:calc(100% + 8px);
    opacity:0;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .color-swatch{
    width:26px;height:26px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
  }
  .color-swatch.selected{border-color:#fff;}
  .color-current-preview{
    cursor:default;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2);
  }
  .field input[type=color]{
    width:44px;height:30px;
    border:none;background:none;cursor:pointer;padding:0;
  }
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1e21;font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger);}

  .wallpaper-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .wp-swatch{
    width:56px;height:40px;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
    background-size:cover;
    background-position:center;
  }
  .wp-swatch.selected{border-color:var(--accent);}
  .field-hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .cat-list-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .cat-list-item:last-child{border-bottom:none;}
  .cat-list-item input[type=text]{flex:1;}
  .cat-list-item .del{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;padding:4px;
  }
  .cat-list-item .del:hover{color:var(--danger);}
  .cat-list-item .del svg{width:15px;height:15px;}
</style>
</head>
<body>

<div id="app">
  <header>
    <div id="clock"></div>
    <div class="actions">
      <button class="icon-btn" id="wallpaper-btn" title="Fond d'écran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button class="icon-btn" id="categories-btn" title="Gérer les catégories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
    </div>
  </header>

  <div id="categories-container"></div>

  <button id="add-category-btn">+ Nouvelle catégorie</button>
</div>

<!-- Modal: add/edit tile -->
<div class="modal-overlay" id="tile-modal-overlay" hidden>
  <div class="modal">
    <h3 id="tile-modal-title">Nouvelle tuile</h3>
    <div class="field">
      <label>Nom</label>
      <input type="text" id="tile-name" placeholder="Ex. Gmail">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="url" id="tile-url" placeholder="https://...">
    </div>
    <div class="field">
      <label>Catégorie</label>
      <select id="tile-category"></select>
    </div>
    <div class="field">
      <label>Icône</label>
      <div id="tile-icon-preview-row" style="display:flex;align-items:center;gap:12px;">
        <div id="tile-icon-preview" style="width:40px;height:40px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:1px solid var(--border);"></div>
        <input type="file" id="tile-icon-input" accept="image/*" style="flex:1;font-size:12px;">
      </div>
      <div class="field-hint" id="tile-icon-hint">Sans image, l'icône du site (favicon) est utilisée automatiquement.</div>
      <button type="button" class="btn" id="tile-icon-clear" style="margin-top:8px;display:none;">Revenir au favicon</button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="tile-cancel">Annuler</button>
      <button class="btn danger" id="tile-delete" style="display:none;">Supprimer</button>
      <button class="btn primary" id="tile-save">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal: wallpaper -->
<div class="modal-overlay" id="wallpaper-modal-overlay" hidden>
  <div class="modal">
    <h3>Fond d'écran</h3>
    <div class="field">
      <label>Dégradés</label>
      <div class="wallpaper-grid" id="gradient-swatches"></div>
    </div>
    <div class="field">
      <label>Couleur unie</label>
      <input type="color" id="wp-color-input" value="#1b1e21">
    </div>
    <div class="field">
      <label>Image personnalisée</label>
      <input type="file" id="wp-file-input" accept="image/*">
      <div class="field-hint">L'image est stockée localement dans votre navigateur. Préférez un fichier léger (moins de 2 Mo).</div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="wp-close">Fermer</button>
    </div>
  </div>
</div>

<!-- Modal: categories manager -->
<div class="modal-overlay" id="categories-modal-overlay" hidden>
  <div class="modal">
    <h3>Catégories</h3>
    <div id="cat-list"></div>
    <button class="btn" id="cat-add-new" style="margin-top:12px;width:100%;">+ Ajouter une catégorie</button>
    <button class="btn" id="cat-realign" style="margin-top:8px;width:100%;">Réaligner l'espacement</button>
    <button class="btn" id="cat-autofit-all" style="margin-top:8px;width:100%;">Réactiver l'ajustement automatique (largeur)</button>
    <div class="modal-actions">
      <button class="btn primary" id="cat-close" style="flex:none;width:100%;">Fermer</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "dashboard-tuiles-data-v1";
  var PALETTE = ["#e8a33d","#4fa8a0","#d9634d","#7c9fd9","#c78fd9","#8fbf6e","#d9b04f","#5cb8c4"];
  var GRADIENTS = [
    "linear-gradient(135deg,#1b1e21,#2e3338)",
    "linear-gradient(135deg,#243b3a,#12181a)",
    "linear-gradient(135deg,#2e2440,#151018)",
    "linear-gradient(135deg,#3a2a1e,#161311)",
    "linear-gradient(135deg,#1e2a3a,#0f1418)",
    "linear-gradient(135deg,#2a1e2e,#12101a)"
  ];

  var data = load();
  migrateCategoryLayout();

  function load(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ return JSON.parse(raw); }catch(e){}
    }
    var defaultCatId = uid();
    return {
      wallpaper:{type:"gradient", value:GRADIENTS[0]},
      categories:[{id:defaultCatId, name:"Sans catégorie", color:"#7c9fd9", colSpan:12, col:0, top:0}],
      tiles:[]
    };
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }

  // Older saved layouts only had colSpan (categories auto-flowed top to
  // bottom). Give them an explicit col/top so they keep their previous
  // stacking order under the new freeform positioning.
  function migrateCategoryLayout(){
    var runningBottom = 0;
    var changed = false;
    data.categories.forEach(function(cat){
      if(cat.colSpan == null){ cat.colSpan = 12; changed = true; }
      if(cat.col == null){ cat.col = 0; changed = true; }
      if(cat.top == null){ cat.top = runningBottom; changed = true; }
      runningBottom = Math.max(runningBottom, cat.top) + 240;
    });
    if(changed) save();
  }

  function applyWallpaper(){
    var wp = data.wallpaper;
    if(wp.type === "image"){
      document.body.style.background = "url(" + wp.value + ") center/cover fixed";
    } else {
      document.body.style.background = wp.value;
      document.body.style.backgroundAttachment = "fixed";
    }
  }

  // If a drag (category move/resize or tile move/swap) is in progress and the
  // window loses focus (alt-tab, devtools, etc.), this guarantees it always
  // gets cleanly cancelled instead of leaving the UI in a stuck state.
  var activeDragCleanup = null;
  window.addEventListener("blur", function(){
    if(activeDragCleanup){ activeDragCleanup(); }
  });

  // ---------- Clock ----------
  function tickClock(){
    var now = new Date();
    var h = String(now.getHours()).padStart(2,"0");
    var m = String(now.getMinutes()).padStart(2,"0");
    var days = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
    var months = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    var dateStr = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()];
    document.getElementById("clock").innerHTML = h+":"+m+"<span>"+dateStr+"</span>";
  }
  tickClock();
  setInterval(tickClock, 10000);

  // ---------- Rendering ----------
  var container = document.getElementById("categories-container");

  function faviconUrl(url){
    try{
      var u = new URL(url);
      return "https://www.google.com/s2/favicons?sz=64&domain=" + u.hostname;
    }catch(e){ return null; }
  }

  var TILE_SIZE = 60; // keep in sync with --tile-size in the CSS above

  function computeFitPx(tilesCount){
    var effectiveCount = Math.max(tilesCount, 1);
    var rowWidthPx = effectiveCount * TILE_SIZE + (effectiveCount - 1) * 10;
    return rowWidthPx + 20 /* category-inner side padding */ + 12 /* category-inner side margins */;
  }

  function computeFitSpan(tilesCount, col, colWidthPx){
    var maxSpan = Math.max(1, 12 - (col || 0));
    if(tilesCount === 0) return Math.min(3, maxSpan);
    var rowWidthPx = tilesCount * TILE_SIZE + (tilesCount - 1) * 10;
    var neededPx = rowWidthPx + 20 /* category-inner side padding */ + 12 /* category-inner side margins */;
    return Math.min(maxSpan, Math.max(3, Math.ceil(neededPx / colWidthPx)));
  }

  function render(){
    container.innerHTML = "";
    var containerWidthPx = container.clientWidth || container.getBoundingClientRect().width;
    var colWidthPx = containerWidthPx / 12;

    data.categories.forEach(function(cat){
      var tiles = data.tiles.filter(function(t){ return t.categoryId === cat.id; });

      var catEl = document.createElement("div");
      catEl.className = "category";
      catEl.dataset.catId = cat.id;
      catEl.style.left = ((cat.col || 0) / 12 * 100) + "%";
      catEl.style.top = (cat.top || 0) + "px";

      if(cat.autoFit !== false && colWidthPx > 0){
        cat.colSpan = computeFitSpan(tiles.length, cat.col, colWidthPx);
        var exactPx = computeFitPx(tiles.length);
        var maxPx = (12 - (cat.col || 0)) * colWidthPx;
        catEl.style.width = Math.min(exactPx, maxPx) + "px";
      } else {
        catEl.style.width = ((cat.colSpan || 12) / 12 * 100) + "%";
      }

      var innerEl = document.createElement("div");
      innerEl.className = "category-inner";

      var band = document.createElement("div");
      band.className = "category-band";
      band.style.background = cat.color;
      innerEl.appendChild(band);

      var relief = document.createElement("div");
      relief.className = "category-relief";
      innerEl.appendChild(relief);

      var head = document.createElement("div");
      head.className = "category-head";
      head.innerHTML =
        '<span class="cat-drag-handle" title="Déplacer la catégorie">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.4"/><circle cx="16" cy="6" r="1.4"/><circle cx="8" cy="12" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="8" cy="18" r="1.4"/><circle cx="16" cy="18" r="1.4"/></svg>' +
        '</span>' +
        '<span class="cat-dot" style="background:'+cat.color+'"></span>' +
        '<h2>'+escapeHtml(cat.name)+'</h2>' +
        '<span class="cat-count">'+tiles.length+'</span>' +
        '<button class="cat-edit-btn tile-add-mini" data-cat="'+cat.id+'" title="Ajouter une tuile">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>' +
        '</button>' +
        '<button class="cat-edit-btn" data-cat="'+cat.id+'" title="Modifier la catégorie">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>' +
        '</button>';
      innerEl.appendChild(head);

      head.querySelector(".tile-add-mini").addEventListener("click", function(){
        openTileModal(null, cat.id);
      });
      head.querySelector(".cat-edit-btn:not(.tile-add-mini)").addEventListener("click", function(){
        openCategoriesModal(cat.id);
      });

      setupCategoryDragMove(catEl, head.querySelector(".cat-drag-handle"), cat);

      var resizeHandle = document.createElement("div");
      resizeHandle.className = "cat-resize-handle";
      resizeHandle.title = "Redimensionner la catégorie";
      setupCategoryResize(resizeHandle, catEl, cat);
      innerEl.appendChild(resizeHandle);

      var grid = document.createElement("div");
      grid.className = "tile-grid";
      grid.dataset.catId = cat.id;

      tiles.forEach(function(tile){
        grid.appendChild(buildTileEl(tile));
      });

      innerEl.appendChild(grid);
      catEl.appendChild(innerEl);
      container.appendChild(catEl);
    });
    layoutContainerHeight();
  }

  function layoutContainerHeight(){
    var maxBottom = 0;
    Array.prototype.forEach.call(container.querySelectorAll(".category"), function(el){
      var top = parseFloat(el.style.top) || 0;
      maxBottom = Math.max(maxBottom, top + el.offsetHeight);
    });
    container.style.height = (maxBottom + 4) + "px";
  }

  function nextCategoryTop(){
    var maxBottom = 0;
    Array.prototype.forEach.call(container.querySelectorAll(".category"), function(el){
      var top = parseFloat(el.style.top) || 0;
      maxBottom = Math.max(maxBottom, top + el.offsetHeight);
    });
    return maxBottom + 20;
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function setupCategoryDragMove(catEl, handle, cat){
    handle.addEventListener("mousedown", function(ev){
      if(ev.button !== 0) return;
      ev.preventDefault();
      if(activeDragCleanup){ activeDragCleanup(); }

      var containerRect = container.getBoundingClientRect();
      var colWidthPx = containerRect.width / 12;
      var startMouseX = ev.clientX, startMouseY = ev.clientY;
      var startLeft = catEl.offsetLeft, startTop = catEl.offsetTop;
      var width = catEl.offsetWidth, height = catEl.offsetHeight;
      var maxLeft = Math.max(0, container.clientWidth - width);
      var pendingLeft = startLeft, pendingTop = startTop;
      var SNAP = 14;

      var otherRects = Array.prototype.slice.call(container.querySelectorAll(".category"))
        .filter(function(el){ return el !== catEl; })
        .map(function(el){
          return {
            left: el.offsetLeft,
            right: el.offsetLeft + el.offsetWidth,
            top: el.offsetTop,
            bottom: el.offsetTop + el.offsetHeight
          };
        });

      catEl.classList.add("cat-moving");

      function onMove(mv){
        var rawLeft = Math.min(Math.max(0, startLeft + (mv.clientX - startMouseX)), maxLeft);
        var rawTop = Math.max(0, startTop + (mv.clientY - startMouseY));

        // Magnetic snap: if an edge of this category lands close to an edge
        // of another category it vertically/horizontally overlaps with,
        // snap flush against it so they butt together with no gap or overlap.
        var bestLeftDist = SNAP, snappedLeft = null;
        var bestTopDist = SNAP, snappedTop = null;

        otherRects.forEach(function(r){
          var vOverlap = rawTop < r.bottom && rawTop + height > r.top;
          if(vOverlap){
            var dRight = Math.abs(rawLeft - r.right);
            if(dRight < bestLeftDist){ bestLeftDist = dRight; snappedLeft = r.right; }
            var dLeft = Math.abs((rawLeft + width) - r.left);
            if(dLeft < bestLeftDist){ bestLeftDist = dLeft; snappedLeft = r.left - width; }
          }
          var hOverlap = rawLeft < r.right && rawLeft + width > r.left;
          if(hOverlap){
            var dBottom = Math.abs(rawTop - r.bottom);
            if(dBottom < bestTopDist){ bestTopDist = dBottom; snappedTop = r.bottom; }
            var dTop = Math.abs((rawTop + height) - r.top);
            if(dTop < bestTopDist){ bestTopDist = dTop; snappedTop = r.top - height; }
          }
        });

        pendingLeft = Math.min(Math.max(0, snappedLeft != null ? snappedLeft : rawLeft), maxLeft);
        pendingTop = Math.max(0, snappedTop != null ? snappedTop : rawTop);
        catEl.style.left = pendingLeft + "px";
        catEl.style.top = pendingTop + "px";
      }
      function finish(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        activeDragCleanup = null;
        catEl.classList.remove("cat-moving");
        var maxCol = Math.max(0, 12 - (cat.colSpan || 12));
        cat.col = Math.max(0, Math.min(maxCol, pendingLeft / colWidthPx));
        cat.top = Math.max(0, pendingTop);
        save();
        render();
      }
      function onUp(){ finish(); }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      activeDragCleanup = finish;
    });
  }

  var lastResizeClickAt = {};

  function autoFitCategoryWidth(cat){
    cat.autoFit = true;
    save();
    render();
  }

  function setupCategoryResize(handle, catEl, cat){
    handle.addEventListener("mousedown", function(ev){
      if(ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      if(activeDragCleanup){ activeDragCleanup(); }

      // Native "dblclick" doesn't survive render() rebuilding the handle
      // element between clicks, so double-click is detected manually here
      // using a timestamp stored outside the DOM.
      var now = Date.now();
      var isDoubleClick = (now - (lastResizeClickAt[cat.id] || 0)) < 400;
      lastResizeClickAt[cat.id] = isDoubleClick ? 0 : now;
      if(isDoubleClick){
        autoFitCategoryWidth(cat);
        return;
      }

      handle.classList.add("resizing");
      var containerRect = container.getBoundingClientRect();
      var colWidth = containerRect.width / 12;
      var startX = ev.clientX;
      var startSpan = cat.colSpan || 12;
      var maxSpan = 12 - (cat.col || 0);
      var pendingSpan = startSpan;
      var moved = false;

      function onMove(mv){
        if(Math.abs(mv.clientX - startX) >= 3){ moved = true; }
        var deltaCols = Math.round((mv.clientX - startX) / colWidth);
        pendingSpan = Math.min(maxSpan, Math.max(3, startSpan + deltaCols));
        if(moved){ catEl.style.width = (pendingSpan / 12 * 100) + "%"; }
      }
      function finish(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        activeDragCleanup = null;
        handle.classList.remove("resizing");
        if(moved){
          cat.colSpan = pendingSpan;
          cat.autoFit = false;
          save();
        }
        render();
      }
      function onUp(){ finish(); }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      activeDragCleanup = finish;
    });
  }

  var DRAG_THRESHOLD = 5;

  function buildTileEl(tile){
    var a = document.createElement("a");
    a.className = "tile";
    a.href = tile.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dataset.tileId = tile.id;
    a.title = tile.name;

    var iconSrc = tile.icon || faviconUrl(tile.url);
    if(tile.icon){ a.classList.add("has-custom-icon"); }
    if(iconSrc){
      var img = document.createElement("img");
      img.className = "tile-icon";
      img.src = iconSrc;
      img.alt = "";
      img.draggable = false;
      img.onerror = function(){
        img.replaceWith(fallbackIcon(tile.name));
      };
      a.appendChild(img);
    } else {
      a.appendChild(fallbackIcon(tile.name));
    }

    var label = document.createElement("div");
    label.className = "tile-label";
    label.textContent = tile.name;
    a.appendChild(label);

    var actions = document.createElement("div");
    actions.className = "tile-actions";
    var editBtn = document.createElement("button");
    editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>';
    editBtn.title = "Modifier";
    editBtn.addEventListener("mousedown", function(ev){ ev.stopPropagation(); });
    editBtn.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      openTileModal(tile.id, tile.categoryId);
    });
    actions.appendChild(editBtn);
    a.appendChild(actions);

    var suppressClick = false;

    a.addEventListener("mousedown", function(ev){
      if(ev.button !== 0) return;
      if(ev.target.closest(".tile-actions")) return;
      if(activeDragCleanup){ activeDragCleanup(); }

      var startX = ev.clientX, startY = ev.clientY;
      var moved = false;
      var ghost = null;
      var rect = a.getBoundingClientRect();
      var grabDx = startX - rect.left;
      var grabDy = startY - rect.top;

      function resolveDropGrid(x, y){
        var stack = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [document.elementFromPoint(x, y)];
        for(var i=0; i<stack.length; i++){
          var el = stack[i];
          if(!el) continue;
          var g = el.closest(".tile-grid");
          if(g) return g;
        }
        return null;
      }

      function onMove(mv){
        if(!moved){
          var dx = mv.clientX - startX, dy = mv.clientY - startY;
          if(Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
          moved = true;
          a.classList.add("dragging");
          a.style.pointerEvents = "none";
          ghost = a.cloneNode(true);
          ghost.classList.add("tile-ghost");
          ghost.style.position = "fixed";
          ghost.style.left = rect.left + "px";
          ghost.style.top = rect.top + "px";
          ghost.style.width = rect.width + "px";
          ghost.style.height = rect.height + "px";
          ghost.style.margin = "0";
          ghost.style.pointerEvents = "none";
          document.body.appendChild(ghost);
        }
        ghost.style.left = (mv.clientX - grabDx) + "px";
        ghost.style.top = (mv.clientY - grabDy) + "px";
      }

      function finish(mv){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        activeDragCleanup = null;

        if(!moved){
          if(ghost){ ghost.remove(); }
          return;
        }
        suppressClick = true;

        var hoverGrid = mv ? resolveDropGrid(mv.clientX, mv.clientY) : null;

        a.classList.remove("dragging");
        a.style.pointerEvents = "";
        if(ghost){ ghost.remove(); ghost = null; }

        if(hoverGrid){
          var newCatId = hoverGrid.dataset.catId;
          var afterEl = getDragAfterElementByPoint(hoverGrid, mv.clientX, mv.clientY, tile.id);
          var others = data.tiles.filter(function(t){ return t.id !== tile.id; });
          var insertIdx;
          if(afterEl){
            var afterTile = data.tiles.find(function(t){ return t.id === afterEl.dataset.tileId; });
            insertIdx = others.indexOf(afterTile);
            if(insertIdx < 0) insertIdx = others.length;
          } else {
            insertIdx = others.length;
          }
          tile.categoryId = newCatId;
          others.splice(insertIdx, 0, tile);
          data.tiles = others;
          save();
        }
        render();
      }
      function onUp(mv){ finish(mv); }

      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      activeDragCleanup = function(){ finish(null); };
    });

    a.addEventListener("click", function(ev){
      if(suppressClick){ ev.preventDefault(); suppressClick = false; }
    });

    return a;
  }

  function fallbackIcon(name){
    var div = document.createElement("div");
    div.className = "tile-fallback";
    div.textContent = (name||"?").trim().charAt(0).toUpperCase();
    return div;
  }

  function getDragAfterElementByPoint(grid, x, y, excludeTileId){
    var els = Array.prototype.slice.call(grid.querySelectorAll(".tile")).filter(function(el){
      return el.dataset.tileId !== excludeTileId;
    });
    var closest = {offset: Number.NEGATIVE_INFINITY, element: null};
    els.forEach(function(child){
      var box = child.getBoundingClientRect();
      if(y >= box.top && y <= box.bottom){
        var horizOffset = x - box.left - box.width/2;
        if(horizOffset < 0 && horizOffset > closest.offset){
          closest = {offset:horizOffset, element:child};
        }
      }
    });
    return closest.element;
  }

  // ---------- Tile modal ----------
  var tileModalOverlay = document.getElementById("tile-modal-overlay");
  var tileNameInput = document.getElementById("tile-name");
  var tileUrlInput = document.getElementById("tile-url");
  var tileCategorySelect = document.getElementById("tile-category");
  var tileModalTitle = document.getElementById("tile-modal-title");
  var tileDeleteBtn = document.getElementById("tile-delete");
  var tileIconInput = document.getElementById("tile-icon-input");
  var tileIconPreview = document.getElementById("tile-icon-preview");
  var tileIconClearBtn = document.getElementById("tile-icon-clear");
  var tileIconHint = document.getElementById("tile-icon-hint");
  var editingTileId = null;
  var pendingIconDataUrl = null;

  function renderIconPreview(){
    tileIconPreview.innerHTML = "";
    if(pendingIconDataUrl){
      var img = document.createElement("img");
      img.src = pendingIconDataUrl;
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "cover";
      tileIconPreview.appendChild(img);
      tileIconClearBtn.style.display = "block";
      tileIconHint.textContent = "Image personnalisée sélectionnée.";
    } else {
      tileIconPreview.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--text-dim)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
      tileIconClearBtn.style.display = "none";
      tileIconHint.textContent = "Sans image, l'icône du site (favicon) est utilisée automatiquement.";
    }
  }

  tileIconInput.addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      pendingIconDataUrl = e.target.result;
      renderIconPreview();
    };
    reader.readAsDataURL(file);
  });

  tileIconClearBtn.addEventListener("click", function(){
    pendingIconDataUrl = null;
    tileIconInput.value = "";
    renderIconPreview();
  });

  function openTileModal(tileId, presetCatId){
    editingTileId = tileId;
    tileIconInput.value = "";
    tileCategorySelect.innerHTML = "";
    data.categories.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.name;
      tileCategorySelect.appendChild(opt);
    });

    if(tileId){
      var tile = data.tiles.find(function(t){ return t.id === tileId; });
      tileModalTitle.textContent = "Modifier la tuile";
      tileNameInput.value = tile.name;
      tileUrlInput.value = tile.url;
      tileCategorySelect.value = tile.categoryId;
      tileDeleteBtn.style.display = "block";
      pendingIconDataUrl = tile.icon || null;
    } else {
      tileModalTitle.textContent = "Nouvelle tuile";
      tileNameInput.value = "";
      tileUrlInput.value = "";
      tileCategorySelect.value = presetCatId || data.categories[0].id;
      tileDeleteBtn.style.display = "none";
      pendingIconDataUrl = null;
    }
    renderIconPreview();
    tileModalOverlay.hidden = false;
    tileNameInput.focus();
  }
  function closeTileModal(){ tileModalOverlay.hidden = true; editingTileId = null; }

  document.getElementById("tile-cancel").addEventListener("click", closeTileModal);
  tileModalOverlay.addEventListener("click", function(ev){ if(ev.target === tileModalOverlay) closeTileModal(); });

  document.getElementById("tile-save").addEventListener("click", function(){
    var name = tileNameInput.value.trim();
    var url = tileUrlInput.value.trim();
    if(!name || !url){ return; }
    if(!/^https?:\/\//i.test(url)){ url = "https://" + url; }
    var catId = tileCategorySelect.value;

    if(editingTileId){
      var tile = data.tiles.find(function(t){ return t.id === editingTileId; });
      tile.name = name; tile.url = url; tile.categoryId = catId; tile.icon = pendingIconDataUrl || null;
    } else {
      data.tiles.push({id:uid(), name:name, url:url, categoryId:catId, icon:pendingIconDataUrl || null});
    }
    try{
      save();
    }catch(err){
      alert("Image trop volumineuse pour être enregistrée localement. Essayez un fichier plus léger.");
      return;
    }
    closeTileModal();
    render();
  });

  tileDeleteBtn.addEventListener("click", function(){
    if(!editingTileId) return;
    data.tiles = data.tiles.filter(function(t){ return t.id !== editingTileId; });
    save();
    closeTileModal();
    render();
  });

  // ---------- Wallpaper modal ----------
  var wpOverlay = document.getElementById("wallpaper-modal-overlay");
  var gradientContainer = document.getElementById("gradient-swatches");

  function renderGradientSwatches(){
    gradientContainer.innerHTML = "";
    GRADIENTS.forEach(function(g){
      var sw = document.createElement("div");
      sw.className = "wp-swatch";
      sw.style.background = g;
      if(data.wallpaper.type === "gradient" && data.wallpaper.value === g) sw.classList.add("selected");
      sw.addEventListener("click", function(){
        data.wallpaper = {type:"gradient", value:g};
        save(); applyWallpaper(); renderGradientSwatches();
      });
      gradientContainer.appendChild(sw);
    });
  }

  document.getElementById("wallpaper-btn").addEventListener("click", function(){
    renderGradientSwatches();
    wpOverlay.hidden = false;
  });
  document.getElementById("wp-close").addEventListener("click", function(){ wpOverlay.hidden = true; });
  wpOverlay.addEventListener("click", function(ev){ if(ev.target === wpOverlay) wpOverlay.hidden = true; });

  document.getElementById("wp-color-input").addEventListener("input", function(ev){
    data.wallpaper = {type:"color", value:ev.target.value};
    save(); applyWallpaper();
  });

  document.getElementById("wp-file-input").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        data.wallpaper = {type:"image", value:e.target.result};
        save(); applyWallpaper();
      }catch(err){
        alert("Image trop volumineuse pour être enregistrée localement. Essayez un fichier plus léger.");
      }
    };
    reader.readAsDataURL(file);
  });

  // ---------- Categories modal ----------
  var catOverlay = document.getElementById("categories-modal-overlay");
  var catListEl = document.getElementById("cat-list");

  function renderCatList(){
    catListEl.innerHTML = "";
    data.categories.forEach(function(cat){
      var row = document.createElement("div");
      row.className = "cat-list-item";

      var nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = cat.name;
      nameInput.addEventListener("input", function(){
        cat.name = nameInput.value;
        save(); render();
      });
      row.appendChild(nameInput);

      var colorRow = document.createElement("div");
      colorRow.className = "color-row";

      var currentSwatch = document.createElement("div");
      currentSwatch.className = "color-swatch color-current-preview";
      currentSwatch.style.background = cat.color;
      currentSwatch.title = "Couleur actuelle";
      colorRow.appendChild(currentSwatch);

      var wheelBtn = document.createElement("label");
      wheelBtn.className = "color-wheel-btn";
      wheelBtn.title = "Choisir une couleur";
      var colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.value = /^#[0-9a-f]{6}$/i.test(cat.color) ? cat.color : "#e8a33d";
      colorInput.addEventListener("input", function(){
        cat.color = colorInput.value;
        currentSwatch.style.background = cat.color;
        save(); render();
      });
      wheelBtn.appendChild(colorInput);
      colorRow.appendChild(wheelBtn);

      row.appendChild(colorRow);

      if(data.categories.length > 1){
        var delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.title = "Supprimer la catégorie";
        delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
        delBtn.addEventListener("click", function(){
          var fallback = data.categories.find(function(c){ return c.id !== cat.id; });
          data.tiles.forEach(function(t){ if(t.categoryId === cat.id) t.categoryId = fallback.id; });
          data.categories = data.categories.filter(function(c){ return c.id !== cat.id; });
          save(); render(); renderCatList();
        });
        row.appendChild(delBtn);
      }

      catListEl.appendChild(row);
    });
  }

  function openCategoriesModal(focusCatId){
    renderCatList();
    catOverlay.hidden = false;
  }

  document.getElementById("categories-btn").addEventListener("click", function(){ openCategoriesModal(); });
  document.getElementById("cat-close").addEventListener("click", function(){ catOverlay.hidden = true; });
  catOverlay.addEventListener("click", function(ev){ if(ev.target === catOverlay) catOverlay.hidden = true; });

  document.getElementById("cat-add-new").addEventListener("click", function(){
    addCategory();
    renderCatList();
  });

  document.getElementById("cat-realign").addEventListener("click", function(){
    realignCategorySpacing();
  });

  document.getElementById("cat-autofit-all").addEventListener("click", function(){
    data.categories.forEach(function(cat){ cat.autoFit = true; });
    save();
    render();
  });

  document.getElementById("add-category-btn").addEventListener("click", function(){
    addCategory();
  });

  // Stacks every category back at column 0, one below another, using each
  // category's actual rendered height plus a fixed 20px gap — this fixes
  // spacing that came out uneven after older data was migrated to the
  // freeform layout using an estimated (not measured) height per category.
  function realignCategorySpacing(){
    var order = Array.prototype.slice.call(container.querySelectorAll(".category"))
      .sort(function(a, b){ return (parseFloat(a.style.top)||0) - (parseFloat(b.style.top)||0); })
      .map(function(el){ return el.dataset.catId; });

    var runningTop = 0;
    order.forEach(function(catId){
      var cat = data.categories.find(function(c){ return c.id === catId; });
      var el = container.querySelector('.category[data-cat-id="'+catId+'"]');
      if(!cat || !el) return;
      cat.col = 0;
      cat.top = runningTop;
      runningTop += el.offsetHeight + 20;
    });
    save();
    render();
  }

  function addCategory(){
    var color = PALETTE[data.categories.length % PALETTE.length];
    data.categories.push({
      id: uid(),
      name: "Nouvelle catégorie",
      color: color,
      colSpan: 12,
      col: 0,
      top: nextCategoryTop()
    });
    save();
    render();
  }

  // ---------- Init ----------
  applyWallpaper();
  render();
})();
</script>
</body>
</html>
